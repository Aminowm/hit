<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lyceum — a personal study desk for the Digital SAT, AP Calculus BC and AP Physics." />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Lyceum Study Desk</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong palette.
      (function () {
        var theme = 'system';
        try {
          var raw = localStorage.getItem('lyceum-v1');
          if (raw) theme = (JSON.parse(raw).state || {}).settings?.theme || 'system';
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
